<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nova AI</title>
<meta name="description" content="Nova AI. Kuch bhi poochein, image banwayein, aur apni chats save rakhein.">
<meta name="theme-color" content="#2563EB">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div class="boot" id="boot" aria-hidden="true">
  <svg class="star" viewBox="0 0 32 32"><path fill="currentColor" d="M16 1.5c.7 6.2 3.1 10.4 6.4 12.4 2.1 1.3 4.9 2.1 8.1 2.1-3.2 0-6 .8-8.1 2.1C19.1 20.1 16.7 24.3 16 30.5c-.7-6.2-3.1-10.4-6.4-12.4-2.1-1.3-4.9-2.1-8.1-2.1 3.2 0 6-.8 8.1-2.1C12.9 11.9 15.3 7.7 16 1.5Z"/></svg>
</div>

<!-- LOGIN / SIGN UP -->
<div class="auth" id="auth" hidden>
  <div class="auth-top">
    <div class="badge"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2Z"/></svg>Generated by Maher</div>
  </div>
  <div class="auth-main">
    <div class="card">
      <svg class="logo star" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 1.5c.7 6.2 3.1 10.4 6.4 12.4 2.1 1.3 4.9 2.1 8.1 2.1-3.2 0-6 .8-8.1 2.1C19.1 20.1 16.7 24.3 16 30.5c-.7-6.2-3.1-10.4-6.4-12.4-2.1-1.3-4.9-2.1-8.1-2.1 3.2 0 6-.8 8.1-2.1C12.9 11.9 15.3 7.7 16 1.5Z"/></svg>
      <h1 id="authTitle">Welcome back</h1>
      <p id="authSub">Nova AI mein log in karein.</p>
      <form id="authForm" class="stack" novalidate>
        <div class="field" id="nameField" hidden>
          <label for="aName">Naam</label>
          <input id="aName" name="name" type="text" autocomplete="name" maxlength="60">
        </div>
        <div class="field">
          <label for="aEmail">Email address</label>
          <input id="aEmail" name="email" type="email" autocomplete="email" inputmode="email" required>
        </div>
        <div class="field">
          <label for="aPass">Password</label>
          <div class="passwrap">
            <input id="aPass" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="eye" id="eyeBtn" aria-label="Password dikhayein" aria-pressed="false">Show</button>
          </div>
        </div>
        <div class="field" id="codeField" hidden>
          <label for="aCode">Invite code</label>
          <input id="aCode" name="code" type="text" autocomplete="off">
        </div>
        <div class="formerr" id="authErr" role="alert" hidden></div>
        <button class="big primary" id="authSubmit" type="submit">Continue</button>
      </form>
      <p class="switch"><span id="switchText">Account nahi hai?</span> <button class="link" id="authSwitch" type="button">Sign up</button></p>
    </div>
  </div>
</div>

<!-- APP -->
<div class="shell" id="app" hidden>
  <aside class="side" id="side" aria-label="Chats">
    <div class="side-head">
      <div class="side-brand"><svg class="star" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 1.5c.7 6.2 3.1 10.4 6.4 12.4 2.1 1.3 4.9 2.1 8.1 2.1-3.2 0-6 .8-8.1 2.1C19.1 20.1 16.7 24.3 16 30.5c-.7-6.2-3.1-10.4-6.4-12.4-2.1-1.3-4.9-2.1-8.1-2.1 3.2 0 6-.8 8.1-2.1C12.9 11.9 15.3 7.7 16 1.5Z"/></svg>Nova AI</div>
      <button class="ibtn only-mobile" id="closeSide" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <button class="navbtn" id="newBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>New chat</button>
    <label class="searchbox" for="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search chats" autocomplete="off"></label>
    <nav class="list" id="list" aria-label="Chat history"></nav>
    <div class="side-foot">
      <div class="pop" id="userMenu" hidden>
        <div class="lbl">Theme</div>
        <div class="seg" id="themeSeg">
          <button type="button" data-t="system" aria-pressed="true">Auto</button>
          <button type="button" data-t="light" aria-pressed="false">Light</button>
          <button type="button" data-t="dark" aria-pressed="false">Dark</button>
        </div>
        <div class="usage" id="usage"></div>
        <button class="item" id="logoutBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span>Log out</span></button>
      </div>
      <button class="user" id="userBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span class="avatar" id="uAvatar">N</span>
        <span class="who"><span class="n" id="uName"></span><span class="s" id="uSub"></span></span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <section class="main">
    <header class="bar">
      <button class="ibtn only-mobile" id="menuBtn" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <button class="modelbtn" id="modelBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="modelName">Nova 1</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="pop" id="modelMenu" hidden></div>
      <div class="spacer"></div>
      <div class="badge" title="Generated by Maher"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4L12 2Z"/></svg>Generated by Maher</div>
    </header>

    <main class="feed" id="feed"></main>

    <footer class="composer">
      <div class="col">
        <form class="box" id="form" autocomplete="off">
          <textarea id="input" rows="1" dir="auto" placeholder="Nova se kuch bhi poochein" aria-label="Message"></textarea>
          <div class="row2">
            <button class="pill" id="imgBtn" type="button" aria-pressed="false" title="Image banwayein"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>Create image</button>
            <button class="send" id="send" type="submit" aria-label="Send"></button>
          </div>
        </form>
        <div class="fine foot">Nova AI ghalti kar sakti hai. Zaroori maloomat dobara check karein.</div>
      </div>
    </footer>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="/app.js"></script>
</body>
</html>
